apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-service-gitops
  namespace: argocd
spec:
  project: default
  source:
    # Point to the same repo, but lock it down to your dedicated branch and folder path
    repoURL: 'https://github.com/your-org/your-app-repo.git'
    targetRevision: kubernetes-deployments
    path: apps/payment-service

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: payments-prod

  syncPolicy:
    # We leave automated sync turned OFF so you are 100% safe
    # But it will continuously poll Git and show you the drift reports
    syncOptions:
      - CreateNamespace=true